{{ define "main" }}
<div class="container">
  <h1>{{ .Title }}</h1>
  {{ range .Pages }}
  <article class="post-item">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.tags }}
    <div class="tags">
      {{ range . }}
      <span class="tag">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}
    <p>{{ .Summary | plainify | truncate 200 }}</p>
  </article>
  {{ end }}
</div>
{{ end }}
